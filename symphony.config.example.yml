polling:
  interval_ms: 30000

repository_sync:
  enabled: true
  interval_ms: 43200000 # 12 hours

agent:
  max_concurrent_agents: 4

repos:
  - id: atlas-api
    workflow: ../atlas-api/WORKFLOW.md
    max_concurrent_agents: 2
    enabled: true
  - id: nebula-web
    workflow: ../nebula-web/WORKFLOW.md
    max_concurrent_agents: 1
    enabled: true
